version: 2

updates:
  # Swift (SPM)
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      swift-crypto:
        patterns:
          - "swift-crypto"
          - "swift-asn1"

  # C# (NuGet) — the library, its tests, and the sample app
  - package-ecosystem: nuget
    directories:
      - /csharp/AudioCapture
      - /csharp/AudioCapture.Tests
      - /Examples/windows/SampleApp
      - /Examples/windows/SampleApp.Tests
    schedule:
      interval: weekly
      day: tuesday
    groups:
      all:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    groups:
      all:
        patterns:
          - "*"
