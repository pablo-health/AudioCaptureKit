name: Soak

# Long-running buffer-reliability soak: drives the real capture graph for
# ~15 minutes of wall-clock real time per suite, from both looped file sources
# (CaptureSoakTests) and a deterministic marker-tone generator
# (SignalGeneratorSoakTests), asserting the ring buffer never overflows or
# stalls, channel separation and marker timing hold, pause/resume recovers
# cleanly, and memory stays bounded. Too slow for the PR gate (which runs a
# ~20s version of the same tests), so it runs weekly and on demand.
#
# Why 15 minutes and not the 50 this used to ask for: in practice a capture
# that is going to glitch has glitched by ~10 minutes, so the extra 40 bought
# no signal. It also cost correctness — SOAK_SECONDS is per-suite, not a total
# budget, and with two suites on each platform a 50-minute setting could not
# fit the job's own timeout. The Windows job hit that ceiling every run since
# the second suite was added and was killed at 75 minutes without ever
# reporting. Raise SOAK_SECONDS by hand on a workflow_dispatch when a longer
# run is actually wanted.
#
# Both clients ship this capture graph, so both soak, and both now have the
# signal-generator/marker suite.

on:
  schedule:
    # Mondays 08:00 UTC.
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: 'Wall-clock capture duration in seconds, per suite (default 900 = 15 min)'
        required: false
        default: '900'

permissions:
  contents: read

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  soak:
    name: Capture soak (buffer reliability, macOS)
    runs-on: macos-15
    # Headroom over two 15-min suites run back to back, plus build.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Cache SPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build --build-tests

      - name: Run soak
        env:
          # schedule has no inputs, so fall back to the 15-minute default.
          SOAK_SECONDS: ${{ github.event.inputs.soak_seconds || '900' }}
        run: |
          echo "Running capture soak for ${SOAK_SECONDS}s of real-time capture"
          swift test --filter Soak

  csharp-soak:
    name: Capture soak (buffer reliability, Windows)
    runs-on: windows-latest
    # Headroom over two 15-min suites run back to back, plus build.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build csharp/AudioCapture.Tests/AudioCapture.Tests.csproj -c Release

      - name: Run soak
        env:
          SOAK_SECONDS: ${{ github.event.inputs.soak_seconds || '900' }}
        run: |
          Write-Output "Running capture soak for $env:SOAK_SECONDS seconds of real-time capture"
          dotnet test csharp/AudioCapture.Tests/AudioCapture.Tests.csproj -c Release --no-build --filter "Category=Soak" --verbosity normal
